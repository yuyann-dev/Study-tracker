# Study Tracker Nginx 配置（Docker Compose 专用）
# 与生产环境 nginx-api.conf 的区别：proxy_pass 指向 Docker 服务名 backend:3001，
# 而非 127.0.0.1:3001（容器内 127.0.0.1 是 Nginx 容器自身，无法访问 backend 容器）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    # 静态资源长缓存（图标、图片）
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML 不缓存（保证及时更新）
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Service Worker：no-cache，每次检查更新
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # 上传头像静态目录（容器内路径）
    location /uploads/ {
        alias /app/uploads/;
        expires 7d;
        access_log off;
    }

    # API 反代到 backend 容器（Docker 服务名）
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        # 大 body：store JSON 可能较大
        client_max_body_size 10m;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # SPA 路由回退：所有非文件路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
