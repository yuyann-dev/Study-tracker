# Study Tracker Nginx 配置（HTTPS 版，与生产 /etc/nginx/conf.d/yystudy.conf 对应）
# 性能要点：gzip_static 发送预压缩 .gz（降 TTFB）、静态资源长缓存、index.html ETag 校验

# HTTP 服务器：全部跳转 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name yystudy.top www.yystudy.top;

    # Let's Encrypt 验证路径（certbot webroot 模式）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yystudy.top www.yystudy.top;

    root /var/www/yystudy;
    index index.html;
    server_tokens off;

    # SSL 证书（certbot，自动续期）
    ssl_certificate     /etc/letsencrypt/live/yystudy.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yystudy.top/privkey.pem;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;

    # gzip：gzip_static 优先直接发送预压缩 .gz（离线 level9），无 .gz 时回退实时压缩，
    # 免去每次请求实时压缩 index.html 的 CPU 开销，显著降低 TTFB
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml application/manifest+json;

    # ACME 验证
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # API 反向代理到 Node.js 后端
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }

    # 用户头像上传目录（^~ 优先于下方图片正则，避免被其改写到网站根）
    location ^~ /uploads/ {
        alias /opt/study-tracker/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 静态资源长缓存（图标等，内容变更频率极低）
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /manifest.json {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # service worker 必须每次最新（防止 SW 更新卡住）
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # index.html：每次校验 ETag，未变返回 304、变了才下载（兼顾及时更新与二次访问速度）
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;
        try_files $uri =404;
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件（.well-known 除外）
    location ~ /\.(?!well-known) {
        deny all;
    }
}
