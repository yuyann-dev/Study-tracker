name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy frontend
        run: |
          # 上传前端文件到临时目录
          tar czf /tmp/frontend.tar.gz -C frontend .
          scp /tmp/frontend.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:/tmp/frontend.tar.gz
          # 在服务器上解压并部署
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} '
            set -e
            mkdir -p /tmp/deploy_frontend
            tar xzf /tmp/frontend.tar.gz -C /tmp/deploy_frontend
            # 创建 css/ 和 js/ 目录
            mkdir -p /var/www/yystudy/css /var/www/yystudy/js
            # 复制根目录文件
            cp -f /tmp/deploy_frontend/index.html /var/www/yystudy/
            cp -f /tmp/deploy_frontend/sw.js /var/www/yystudy/
            cp -f /tmp/deploy_frontend/manifest.json /var/www/yystudy/
            cp -f /tmp/deploy_frontend/icon-*.png /var/www/yystudy/ 2>/dev/null || true
            cp -f /tmp/deploy_frontend/apple-touch-icon.png /var/www/yystudy/ 2>/dev/null || true
            cp -f /tmp/deploy_frontend/favicon-64.png /var/www/yystudy/ 2>/dev/null || true
            # 复制 css/ 和 js/ 目录（框架化重构后新增）
            cp -rf /tmp/deploy_frontend/css/* /var/www/yystudy/css/ 2>/dev/null || true
            cp -rf /tmp/deploy_frontend/js/* /var/www/yystudy/js/ 2>/dev/null || true
            cd /var/www/yystudy/
            # gzip 压缩所有静态资源
            for f in index.html sw.js manifest.json css/style.css js/app.js js/auth.js js/utils.js js/storage.js js/review.js js/render.js js/ui.js js/events.js; do
              if [ -f "$f" ]; then gzip -c -9 "$f" > "${f}.gz"; fi
            done
            chown -R study:study /var/www/yystudy/
            chmod -R go+rX /var/www/yystudy/
            rm -rf /tmp/deploy_frontend /tmp/frontend.tar.gz
            echo "Frontend deployed"
          '

      - name: Deploy backend
        run: |
          # 上传后端代码（排除 node_modules、.env、data、logs）
          tar czf /tmp/backend.tar.gz \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='data' \
            --exclude='logs' \
            --exclude='uploads' \
            -C backend .
          scp /tmp/backend.tar.gz ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:/tmp/backend.tar.gz
          # 在服务器上只覆盖代码文件，不碰 .env 和 node_modules
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} '
            set -e
            mkdir -p /tmp/deploy_backend
            tar xzf /tmp/backend.tar.gz -C /tmp/deploy_backend
            # 只覆盖代码文件和目录
            cp -f /tmp/deploy_backend/*.js /tmp/deploy_backend/package.json /opt/study-tracker/backend/ 2>/dev/null || true
            cp -rf /tmp/deploy_backend/middleware /opt/study-tracker/backend/ 2>/dev/null || true
            cp -rf /tmp/deploy_backend/routes /opt/study-tracker/backend/ 2>/dev/null || true
            cp -rf /tmp/deploy_backend/utils /opt/study-tracker/backend/ 2>/dev/null || true
            cp -rf /tmp/deploy_backend/scripts /opt/study-tracker/backend/ 2>/dev/null || true
            chown -R study:study /opt/study-tracker/backend/
            systemctl restart study-tracker
            sleep 2
            systemctl is-active study-tracker
            rm -rf /tmp/deploy_backend /tmp/backend.tar.gz
            echo "Backend deployed"
          '

      - name: Health check
        run: |
          sleep 3
          curl -sf https://${{ secrets.APP_DOMAIN }}/api/health || exit 1
          echo "Health check passed"
